  name: Trigger Stage Deploy

  on:
    push:
      branches:
        - 'chore/pipeline_move'

  env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  jobs:
    trigger:
      runs-on: ubuntu-latest
      steps:
        - name: Dispatch to CICD repo
          env:
            SHA: ${{ github.sha }}
            REF: ${{ github.ref }}
            REF_NAME: ${{ github.ref_name }}
            REF_TYPE: ${{ github.ref_type }}
            CICD_DISPATCH_TOKEN: ${{ secrets.CICD_DISPATCH_TOKEN }}
          run: |
            curl -fsS -X POST \
              -H "Authorization: Bearer ${CICD_DISPATCH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/euler-xyz/euler-lite-cicd/dispatches \
              -d "$(jq -n \
                --arg sha "$SHA" \
                --arg ref "$REF" \
                --arg ref_name "$REF_NAME" \
                --arg ref_type "$REF_TYPE" \
                '{event_type:"deploy-stage",client_payload:{sha:$sha,ref:$ref,ref_name:$ref_name,ref_type:$ref_type}}')"
