name: Claude Code Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    name: Review
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    outputs:
      has_critical: ${{ steps.critical-check.outputs.has_critical }}
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '@claude review') &&
      (
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'OWNER'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.LLM_API_KEY }}
      ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ vars.LLM_REVIEW_MODEL || 'anthropic/claude-opus-4.6' }}
      ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ vars.LLM_COORDINATOR_MODEL || 'anthropic/claude-opus-4.6' }}
      CLAUDE_CODE_SUBAGENT_MODEL: ${{ vars.LLM_REVIEW_MODEL || 'anthropic/claude-opus-4.6' }}
    permissions:
      contents: read
      pull-requests: write
      actions: read
      id-token: write
    steps:
      - name: Get PR info
        id: pr-info
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('pr_number', context.issue.number);
            core.setOutput('base_ref', pr.base.ref);

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr-info.outputs.head_sha }}
          fetch-depth: 0

      - name: Run Reviews
        uses: anthropics/claude-code-action@v1
        env:
          PR_NUMBER: ${{ steps.pr-info.outputs.pr_number }}
          BASE_REF: ${{ steps.pr-info.outputs.base_ref }}
        with:
          anthropic_api_key: ${{ secrets.LLM_API_KEY }}
          use_sticky_comment: "true"
          track_progress: "true"
          settings: |
            {
              "permissions": {
                "allow": ["Bash(git diff *)", "Bash(gh api repos/*)", "Read", "Write", "Glob", "Grep", "WebFetch"]
              }
            }
          prompt: |
            First, create three tasks upfront before doing anything else: "Stack review", "Business review", "Security review".
            Then use agent teams to run /claude-review-stack, /claude-review-business, and /claude-review-security in parallel.
            Mark each task complete only when that specific agent returns its findings.
            Once all three are marked complete, use /inline-pr-comments once to post a single consolidated PR review with inline comments.

      - name: Fail if critical issues found
        id: critical-check
        run: |
          if [ ! -f /tmp/review.json ]; then exit 1; fi
          count=$(python3 -c "import json; d=json.load(open('/tmp/review.json')); b=d.get('body',''); cs=d.get('comments',[]); print(b.count('🔴 Critical:') + sum(1 for c in cs if '🔴 Critical:' in c.get('body','')))")
          if [ "$count" -gt 0 ]; then
            echo "has_critical=true" >> $GITHUB_OUTPUT
            echo "::error::Review found $count critical issue(s) that must be resolved before merging."
            exit 1
          fi

  autofix:
    name: Auto-fix / Open PR
    needs: [review]
    concurrency:
      group: claude-autofix-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    if: |
      always() &&
      needs.review.result != 'cancelled' &&
      (
        needs.review.outputs.has_critical == 'true' ||
        startsWith(github.event.comment.body, '@claude fix')
      ) &&
      (
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          (
            github.event.comment.author_association == 'MEMBER' ||
            github.event.comment.author_association == 'OWNER'
          )
        ) ||
        github.event_name == 'pull_request_review_comment'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.LLM_API_KEY }}
      ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ vars.LLM_REVIEW_MODEL || 'anthropic/claude-opus-4.6' }}
      ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ vars.LLM_COORDINATOR_MODEL || 'anthropic/claude-opus-4.6' }}
      CLAUDE_CODE_SUBAGENT_MODEL: ${{ vars.LLM_REVIEW_MODEL || 'anthropic/claude-opus-4.6' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Check commenter permission
        if: github.event_name == 'pull_request_review_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor
            });
            if (!['admin', 'write'].includes(data.permission)) {
              core.setFailed(`${context.actor} does not have write access.`);
            }

      - name: Get PR info
        id: pr-info
        uses: actions/github-script@v7
        with:
          script: |
            let pr;
            if (context.eventName === 'pull_request' || context.eventName === 'pull_request_review_comment') {
              pr = context.payload.pull_request;
            } else {
              const { data } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number
              });
              pr = data;
            }
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('pr_number', pr.number);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_ref', pr.head.ref);
            if (pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('Cannot auto-fix: PR is from a fork. Push access is required.');
            }

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr-info.outputs.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Auto-fix
        uses: anthropics/claude-code-action@v1
        env:
          PR_NUMBER: ${{ steps.pr-info.outputs.pr_number }}
          BASE_REF: ${{ steps.pr-info.outputs.base_ref }}
          HEAD_REF: ${{ steps.pr-info.outputs.head_ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          FIX_SCOPE: ${{ contains(github.event.comment.body, 'fix all') && 'all' || 'criticals' }}
          EVENT_NAME: ${{ github.event_name }}
          INLINE_FILE: ${{ github.event.comment.path }}
          INLINE_DIFF_HUNK: ${{ github.event.comment.diff_hunk }}
          INLINE_REPLY_TO_ID: ${{ github.event.comment.in_reply_to_id }}
        with:
          anthropic_api_key: ${{ secrets.LLM_API_KEY }}
          use_sticky_comment: "true"
          track_progress: "true"
          settings: |
            {
              "permissions": {
                "allow": ["Bash(git *)", "Bash(gh *)", "Bash(python3 /tmp/*)", "Read", "Write", "Edit", "Glob", "Grep"]
              }
            }
          prompt: |
            Check the COMMENT_BODY env var.

            If it starts with "@claude fix" and contains specific instructions after it that are not "criticals" or "all" (e.g. "@claude fix move apiSecret to server-only config"), implement exactly those instructions, then commit and push directly to the current PR branch ($HEAD_REF), and post a comment on PR #$PR_NUMBER summarising what was done. Do NOT open a new PR.

            If COMMENT_BODY is "@claude fix", "@claude fix criticals", or "@claude fix all" (or this job was triggered automatically after a review found critical issues):
            - FIX_SCOPE is already set: "criticals" fixes only 🔴 Critical findings; "all" fixes 🔴 Critical and 🟠 Major findings from all reviewers including CodeRabbit.
            - If EVENT_NAME is "pull_request_review_comment": scope the fix to only the finding at the inline comment location, then commit and push directly to the current PR branch ($HEAD_REF), and post a comment on PR #$PR_NUMBER summarising what was done. Do NOT open a new PR.
              - File: $INLINE_FILE
              - Diff hunk: $INLINE_DIFF_HUNK
              - If INLINE_REPLY_TO_ID is set, fetch the parent comment body with: gh api repos/${{ github.repository }}/pulls/comments/$INLINE_REPLY_TO_ID --jq '.body' — that is the finding being addressed.
              - If INLINE_REPLY_TO_ID is not set, use INLINE_FILE and INLINE_DIFF_HUNK to identify the issue at that location and fix it.
            - Otherwise: run /claude-autofix to implement fixes, open a fix PR, and comment the link on this PR.

  interactive:
    name: Interactive
    concurrency:
      group: claude-interactive-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    if: |
      github.event.sender.type != 'Bot' &&
      startsWith(github.event.comment.body, '@claude') &&
      !contains(github.event.comment.body, '@claude review') &&
      !contains(github.event.comment.body, '@claude fix') &&
      (
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          (
            github.event.comment.author_association == 'MEMBER' ||
            github.event.comment.author_association == 'OWNER'
          )
        ) ||
        github.event_name == 'pull_request_review_comment'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.LLM_API_KEY }}
      ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ vars.LLM_REVIEW_MODEL || 'anthropic/claude-opus-4.6' }}
      ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ vars.LLM_COORDINATOR_MODEL || 'anthropic/claude-opus-4.6' }}
      CLAUDE_CODE_SUBAGENT_MODEL: ${{ vars.LLM_REVIEW_MODEL || 'anthropic/claude-opus-4.6' }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Check commenter permission
        if: github.event_name == 'pull_request_review_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor
            });
            if (!['admin', 'write'].includes(data.permission)) {
              core.setFailed(`${context.actor} does not have write access.`);
            }

      - name: Get PR info
        id: pr-info
        uses: actions/github-script@v7
        with:
          script: |
            let pr;
            if (context.eventName === 'pull_request_review_comment') {
              pr = context.payload.pull_request;
            } else {
              const { data } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number
              });
              pr = data;
            }
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('pr_number', pr.number);
            core.setOutput('base_ref', pr.base.ref);

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr-info.outputs.head_sha }}
          fetch-depth: 0

      - name: Respond to comment
        uses: anthropics/claude-code-action@v1
        env:
          PR_NUMBER: ${{ steps.pr-info.outputs.pr_number }}
          BASE_REF: ${{ steps.pr-info.outputs.base_ref }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        with:
          anthropic_api_key: ${{ secrets.LLM_API_KEY }}
          use_sticky_comment: "true"
          track_progress: "true"
          settings: |
            {
              "permissions": {
                "allow": ["Bash(git diff *)", "Bash(gh api *)", "Read", "Glob", "Grep"]
              }
            }
          prompt: |
            A team member commented on this PR (see COMMENT_BODY env var).

            You have access to the full repository. Focus your response on the context of this PR and the changed files.
            Use git diff origin/$BASE_REF...HEAD to understand what changed.
            Post your response as a comment on PR #$PR_NUMBER using gh api.
