  name: Trigger Base Deploy

  on:
    push:
      tags:
        - 'v*'
        - '!v*-rc*'
        - '!v*-beta*'

  env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  jobs:
    trigger:
      runs-on: ubuntu-latest
      steps:
        - name: Dispatch to CICD repo
          env:
            SHA: ${{ github.sha }}
            REF: ${{ github.ref }}
            REF_NAME: ${{ github.ref_name }}
            REF_TYPE: ${{ github.ref_type }}
            CICD_DISPATCH_TOKEN: ${{ secrets.CICD_DISPATCH_TOKEN }}
            CICD_REPO: ${{ secrets.CICD_REPO }}
          run: |
            curl -fsS -X POST \
              -H "Authorization: Bearer ${CICD_DISPATCH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/euler-xyz/${CICD_REPO}/dispatches" \
              -d "$(jq -n \
                --arg sha "$SHA" \
                --arg ref "$REF" \
                --arg ref_name "$REF_NAME" \
                --arg ref_type "$REF_TYPE" \
                '{event_type:"deploy-base",client_payload:{sha:$sha,ref:$ref,ref_name:$ref_name,ref_type:$ref_type}}')"
