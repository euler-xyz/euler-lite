name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install -g npm@11.20.0

      - run: npm ci

      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install -g npm@11.20.0

      - run: npm ci

      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install -g npm@11.20.0

      - run: npm ci

      # tests/utils/logger-bundle.test.ts inspects the production client bundle
      # at .output/public/_nuxt and hard-fails under CI when it is absent, so
      # the build must run before the test suite.
      - run: npm run build

      - run: npm run test:run

      - name: Install Chromium for CSP controls
        run: npx playwright install --with-deps chromium

      - name: Check production CSP in a real browser
        env:
          HOST: 127.0.0.1
          PORT: 3000
          DOPPLER_ENVIRONMENT: dev
        run: |
          node .output/server/index.mjs > /tmp/csp-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/healthz > /dev/null; then break; fi
            sleep 1
          done
          npm run csp:controls -- --url http://127.0.0.1:3000
