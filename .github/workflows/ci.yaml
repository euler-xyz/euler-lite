name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EULER_SDK_BRANCH: feat/public-labels-v3-sdk

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm install -g npm@11.10.0

      - run: npm ci

      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm install -g npm@11.10.0

      - run: npm ci

      - run: sh scripts/install-preview-sdk.sh

      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm install -g npm@11.10.0

      - run: npm ci

      - run: sh scripts/install-preview-sdk.sh

      # tests/utils/logger-bundle.test.ts inspects the production client bundle
      # at .output/public/_nuxt and hard-fails under CI when it is absent, so
      # the build must run before the test suite.
      - run: npm run build

      - run: npm run test:run
