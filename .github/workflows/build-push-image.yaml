name: Build, Push & Deploy
on:
  workflow_dispatch:
  push:
    branches:
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.generate-tag.outputs.image_tag }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.ref }}

      - name: Generate image tag
        id: generate-tag
        run: |
          TIMESTAMP=$(date -u +'%H%M_%d%m%Y')
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          IMAGE_TAG="${TIMESTAMP}_${SHORT_SHA}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "Generated image tag: ${IMAGE_TAG}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PUSH_IMAGE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@f2e9fc6c2b355c1890b65e6f6f0e2ac3e6e22f78

      - name: Build, tag, and push docker image to Amazon ECR
        id: build
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.generate-tag.outputs.image_tag }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          FULL_IMAGE="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build --platform linux/amd64 -t euler-lite .
          docker tag euler-lite "$FULL_IMAGE"
          docker tag euler-lite "$REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$FULL_IMAGE"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

  deploy:
    name: Deploy to ECS
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ secrets.ECS_TASK_DEFINITION }} \
            --query taskDefinition \
            | jq 'del(.taskDefinitionArn, .revision, .status, .registeredAt, .registeredBy, .requiresAttributes, .compatibilities)' \
            > task-definition.json

      - name: Update image in task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@77954e213ba1f9f9cb016b86a1d4f6fcdea0d57e
        with:
          task-definition: task-definition.json
          container-name: ${{ secrets.ECS_CONTAINER_NAME }}
          image: ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ needs.build-push.outputs.image_tag }}

      - name: Deploy new task definition to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@fc8fc60f3a60ffd500fcb13b209c59d221ac8c8c
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ secrets.ECS_SERVICE }}
          cluster: ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: false

      - name: Wait for ECS service stability and stream events
        env:
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
        run: |
          set -euo pipefail

          echo "Waiting for ECS service stability..."
          timeout_seconds=900
          poll_interval_seconds=15
          deadline=$((SECONDS + timeout_seconds))

          while [ "$SECONDS" -lt "$deadline" ]; do
            echo ""
            echo "Recent ECS service events:"
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --query "services[0].events" \
              --output table || true

            primary_rollout_state=$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --query "services[0].deployments[?status==\`PRIMARY\`].rolloutState | [0]" \
              --output text)

            primary_rollout_reason=$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --query "services[0].deployments[?status==\`PRIMARY\`].rolloutStateReason | [0]" \
              --output text)

            if [ "$primary_rollout_state" = "COMPLETED" ]; then
              echo "ECS rollout completed."
              exit 0
            fi

            if [ "$primary_rollout_state" = "FAILED" ]; then
              echo "ECS rollout failed: $primary_rollout_reason"
              exit 1
            fi

            echo "Current rollout state: $primary_rollout_state"
            [ "$primary_rollout_reason" != "None" ] && echo "Reason: $primary_rollout_reason"
            sleep "$poll_interval_seconds"
          done

          echo "Timed out waiting for ECS service stability after ${timeout_seconds}s."
          exit 1
