name: Build, Push & Deploy (stage)
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'ECR image tag to deploy'
        required: true
  push:
    tags:
      - 'v*-rc*'
      - 'v*-beta*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    name: Build & Push Image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.generate-tag.outputs.image_tag }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Verify tag is on development
        run: |
          if ! git log --first-parent --format=%H origin/development | grep -q "^${{ github.sha }}$"; then
            echo "::error::Tag does not point to a commit on development's first-parent history. Aborting."
            exit 1
          fi

      - name: Generate image tag
        id: generate-tag
        run: |
          TIMESTAMP=$(date -u +'%H%M_%d%m%Y')
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          IMAGE_TAG="${TIMESTAMP}_${SHORT_SHA}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "Generated image tag: ${IMAGE_TAG}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PUSH_IMAGE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@f2e9fc6c2b355c1890b65e6f6f0e2ac3e6e22f78 # v2.1.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: euler-lite
          build-args: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract static assets from image
        run: |
          docker create --name temp-euler euler-lite
          docker cp temp-euler:/usr/src/app/.output/public ./static-output
          docker rm temp-euler

      - name: Configure AWS credentials for S3
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload static assets to S3
        run: |
          aws s3 sync ./static-output/_nuxt \
            s3://${{ secrets.S3_STATIC_ASSETS_BUCKET_STAGE }}/_nuxt \
            --exclude "builds/**" \
            --cache-control "public,max-age=31536000,immutable"

          if [ -d ./static-output/_nuxt/builds ]; then
            aws s3 sync ./static-output/_nuxt/builds \
              s3://${{ secrets.S3_STATIC_ASSETS_BUCKET_STAGE }}/_nuxt/builds \
              --exclude "meta/**" \
              --cache-control "no-cache"
          fi

          if [ -d ./static-output/_nuxt/builds/meta ]; then
            aws s3 sync ./static-output/_nuxt/builds/meta \
              s3://${{ secrets.S3_STATIC_ASSETS_BUCKET_STAGE }}/_nuxt/builds/meta \
              --cache-control "public,max-age=31536000,immutable"
          fi

      - name: Tag and push docker image to Amazon ECR
        id: build
        env:
          REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ steps.generate-tag.outputs.image_tag }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          FULL_IMAGE="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker tag euler-lite "$FULL_IMAGE"
          docker push "$FULL_IMAGE"

  deploy:
    name: Deploy to ECS
    if: always() && (needs.build-push.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.build-push.result == 'skipped'))
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Verify dispatch is from development
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.ref }}" != "refs/heads/development" ]; then
            echo "::error::workflow_dispatch must be run from the development branch."
            exit 1
          fi

      - name: Resolve image tag
        id: resolve-tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          BUILD_TAG: ${{ needs.build-push.outputs.image_tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$BUILD_TAG"
          fi
          if ! echo "$TAG" | grep -qE '^[a-zA-Z0-9_.-]+$'; then
            echo "::error::Invalid image tag: must match [a-zA-Z0-9_.-]+"
            exit 1
          fi
          echo "image_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Notify Slack deployment started
        env:
          IMAGE_TAG: ${{ steps.resolve-tag.outputs.image_tag }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "SLACK_WEBHOOK_URL is not configured; skipping Slack notification."
            exit 0
          fi

          VERSION="manual deploy (${GITHUB_REF_NAME})"
          RELEASE_NOTES_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases"
          RELEASE_NOTES_LABEL="Releases"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
            RELEASE_NOTES_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
            RELEASE_NOTES_LABEL="${VERSION} release notes"
          fi

          TEXT=$(printf '%s\n' \
            ":rocket: *Euler Lite stage deploy started*" \
            "*Version:* ${VERSION}" \
            "*Image tag:* ${IMAGE_TAG}" \
            "*Status:* deployment started" \
            "*Release notes:* <${RELEASE_NOTES_URL}|${RELEASE_NOTES_LABEL}>" \
            "*Workflow run:* <${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER}>")

          jq -n --arg text "$TEXT" '{text: $text}' \
            | curl -fsS --max-time 10 --retry 2 --retry-delay 2 -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL" \
            || echo "::warning::Slack notification failed"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ secrets.ECS_TASK_DEFINITION_STAGE }} \
            --query taskDefinition \
            | jq 'del(.taskDefinitionArn, .revision, .status, .registeredAt, .registeredBy, .requiresAttributes, .compatibilities)' \
            > task-definition.json

      - name: Update image in task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@77954e213ba1f9f9cb016b86a1d4f6fcdea0d57e # v1.8.4
        with:
          task-definition: task-definition.json
          container-name: ${{ secrets.ECS_CONTAINER_NAME_STAGE }}
          image: ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ steps.resolve-tag.outputs.image_tag }}

      - name: Deploy new task definition to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@fc8fc60f3a60ffd500fcb13b209c59d221ac8c8c # v2.6.1
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ secrets.ECS_SERVICE_STAGE }}
          cluster: ${{ secrets.ECS_CLUSTER_STAGE }}
          wait-for-service-stability: false

      - name: Wait for ECS service stability and stream events
        env:
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER_STAGE }}
          ECS_SERVICE: ${{ secrets.ECS_SERVICE_STAGE }}
        run: |
          set -euo pipefail

          echo "Waiting for ECS service stability..."
          timeout_seconds=900
          poll_interval_seconds=15
          deadline=$((SECONDS + timeout_seconds))

          while [ "$SECONDS" -lt "$deadline" ]; do
            echo ""
            echo "Recent ECS service events:"
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --query "services[0].events" \
              --output table || echo "WARNING: failed to fetch ECS service events"

            primary_rollout_state=$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --query "services[0].deployments[?status==\`PRIMARY\`].rolloutState | [0]" \
              --output text)

            primary_rollout_reason=$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --query "services[0].deployments[?status==\`PRIMARY\`].rolloutStateReason | [0]" \
              --output text)

            if [ "$primary_rollout_state" = "COMPLETED" ]; then
              echo "ECS rollout completed."
              exit 0
            fi

            if [ "$primary_rollout_state" = "FAILED" ]; then
              echo "ECS rollout failed: $primary_rollout_reason"
              exit 1
            fi

            echo "Current rollout state: $primary_rollout_state"
            [ "$primary_rollout_reason" != "None" ] && echo "Reason: $primary_rollout_reason"
            sleep "$poll_interval_seconds"
          done

          echo "Timed out waiting for ECS service stability after ${timeout_seconds}s."
          exit 1

      - name: Notify Slack deployment finished
        if: always()
        env:
          IMAGE_TAG: ${{ steps.resolve-tag.outputs.image_tag }}
          JOB_STATUS: ${{ job.status }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "SLACK_WEBHOOK_URL is not configured; skipping Slack notification."
            exit 0
          fi

          VERSION="manual deploy (${GITHUB_REF_NAME})"
          RELEASE_NOTES_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases"
          RELEASE_NOTES_LABEL="Releases"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
            RELEASE_NOTES_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
            RELEASE_NOTES_LABEL="${VERSION} release notes"
          fi

          STATUS_EMOJI=":white_check_mark:"
          STATUS_TEXT="completed"
          PROGRESS_TEXT="ECS rollout completed"

          if [ "${JOB_STATUS}" != "success" ]; then
            STATUS_EMOJI=":x:"
            STATUS_TEXT="failed"
            PROGRESS_TEXT="deploy did not complete successfully"

            if [ "${JOB_STATUS}" = "cancelled" ]; then
              STATUS_TEXT="cancelled"
            fi
          fi

          TEXT=$(printf '%s\n' \
            "${STATUS_EMOJI} *Euler Lite stage deploy ${STATUS_TEXT}*" \
            "*Version:* ${VERSION:-unknown}" \
            "*Image tag:* ${IMAGE_TAG:-unknown}" \
            "*Status:* ${PROGRESS_TEXT}" \
            "*Release notes:* <${RELEASE_NOTES_URL}|${RELEASE_NOTES_LABEL}>" \
            "*Workflow run:* <${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER}>")

          jq -n --arg text "$TEXT" '{text: $text}' \
            | curl -fsS --max-time 10 --retry 2 --retry-delay 2 -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL" \
            || echo "::warning::Slack notification failed"

  notify-slack-build-push-failed:
    name: Notify Slack Build/Push Failed
    if: always() && github.event_name == 'push' && needs.build-push.result != 'success'
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack build/push failed
        env:
          BUILD_RESULT: ${{ needs.build-push.result }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "SLACK_WEBHOOK_URL is not configured; skipping Slack notification."
            exit 0
          fi

          VERSION="manual deploy (${GITHUB_REF_NAME})"
          RELEASE_NOTES_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases"
          RELEASE_NOTES_LABEL="Releases"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
            RELEASE_NOTES_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
            RELEASE_NOTES_LABEL="${VERSION} release notes"
          fi

          STATUS_TEXT="failed"

          if [ "${BUILD_RESULT}" = "cancelled" ]; then
            STATUS_TEXT="cancelled"
          fi

          TEXT=$(printf '%s\n' \
            ":x: *Euler Lite stage deploy ${STATUS_TEXT}*" \
            "*Version:* ${VERSION:-unknown}" \
            "*Image tag:* not generated" \
            "*Status:* build/push did not complete; deploy was not started" \
            "*Release notes:* <${RELEASE_NOTES_URL}|${RELEASE_NOTES_LABEL}>" \
            "*Workflow run:* <${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER}>")

          jq -n --arg text "$TEXT" '{text: $text}' \
            | curl -fsS --max-time 10 --retry 2 --retry-delay 2 -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL" \
            || echo "::warning::Slack notification failed"
